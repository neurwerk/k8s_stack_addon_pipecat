[project]
name = "pipecat-simple-chatbot"
version = "0.1.0"
description = "Complete Pipecat chatbot with browser OIDC and delegated AI gateway access"
requires-python = ">=3.12,<3.13"
license = "BSD-2-Clause"
dependencies = [
  "pipecat-ai[webrtc,silero]==1.14.0",
  "aiortc==1.15.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "loguru==0.7.3",
  "pydantic==2.14.1",
  "PyJWT[crypto]==2.15.1",
  "uvicorn==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
build = ["packaging==26.3", "PyYAML==6.0.3", "pip==26.2.2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["simple_chatbot", "server.py", "prepare_dependencies.py"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neurwerk-pipecat-tooling"
version = "0.1.0"
description = "Pipecat add-on selection and credential preparation."
readme = "README.md"
authors = [{ name = "neurwerk", email = "dev@neurwerk.com" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/neurwerk_pipecat_tooling"]

[tool.hatch.build.targets.sdist]
exclude = ["cli_tools/"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty]

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.49", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/neurwerk/k8s_stack_addon_pipecat"
Repository = "https://github.com/neurwerk/k8s_stack_addon_pipecat"
Issues = "https://github.com/neurwerk/k8s_stack_addon_pipecat/issues"

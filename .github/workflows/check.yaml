name: Check and build (no publication)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Reviewed candidate for source CI only; tag-driven publication requires stable Base.
  BASE_REF: e5eca150c0f71d3f80b135c67f2451758a8f3db1
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neurwerk/k8s_stack_base
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'v0.4.0' || env.BASE_REF }}
          path: build/base
      - uses: jdx/mise-action@v2
      - run: uv sync --frozen
      - run: npm ci
        working-directory: apps/simple-chatbot/frontend
      - run: make check BASE="$GITHUB_WORKSPACE/build/base"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neurwerk-pipecat:local
          platforms: linux/amd64
      - name: Verify offline bundled models and runtime imports
        run: |
          docker run --rm --network none --entrypoint python neurwerk-pipecat:local -c 'from pipecat.audio.vad.silero import SileroVADAnalyzer; from pipecat.audio.turn.smart_turn.local_smart_turn_v3 import LocalSmartTurnAnalyzerV3; from neurwerk_pipecat.startup import main; SileroVADAnalyzer(); LocalSmartTurnAnalyzerV3()'

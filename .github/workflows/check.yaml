name: Check and build (no publication)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Reviewed Base 0.3.33 release-preparation source.
  BASE_REF: e1b9c226c293fb99b2bc0da108d397a157a55d7f
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neurwerk/k8s_stack_base
          ref: ${{ env.BASE_REF }}
          path: build/base
      - uses: jdx/mise-action@v2
      - run: uv sync --frozen
      - run: npm ci
        working-directory: apps/simple-chatbot/frontend
      - run: make check BASE="$GITHUB_WORKSPACE/build/base"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: simple-chatbot-build
          path: |
            apps/simple-chatbot/frontend/dist/
            apps/simple-chatbot/wheels/
          if-no-files-found: error
          retention-days: 3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neurwerk-pipecat:local
          platforms: linux/amd64

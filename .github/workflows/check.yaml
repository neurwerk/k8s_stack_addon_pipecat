name: Check and build (no publication)
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Reviewed candidate for source CI only; tag-driven publication requires stable Base.
  BASE_REF: 0d2a31614776a1c85e693d9e6620849faa5b2e19
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neurwerk/k8s_stack_base
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'v0.3.31' || env.BASE_REF }}
          path: build/base
      - uses: jdx/mise-action@v2
      - run: uv sync --frozen
      - run: npm ci
        working-directory: apps/simple-chatbot/frontend
      - run: make check BASE="$GITHUB_WORKSPACE/build/base"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: neurwerk-pipecat:local
          platforms: linux/amd64

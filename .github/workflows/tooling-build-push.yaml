name: Build and Push Add-on Tooling
on:
  push:
    tags: ["tooling/v*"]
concurrency:
  group: pipecat-tooling-release-${{ github.ref }}
  cancel-in-progress: false
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: neurwerk/k8s-stack-addon-pipecat-tooling
jobs:
  validate:
    name: Validate tooling release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate tooling tag, project and lock versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^tooling/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          RELEASE_VERSION="${BASH_REMATCH[1]}" python3 - <<'PY'
          import os,tomllib
          from pathlib import Path
          project=tomllib.loads(Path('tooling/pyproject.toml').read_text())
          lock=tomllib.loads(Path('tooling/uv.lock').read_text())
          locked=next(p['version'] for p in lock['package'] if p['name']=='pipecat-tooling')
          if {project['project']['version'],locked} != {os.environ['RELEASE_VERSION']}:
              raise SystemExit('Tooling tag, project and lock versions must match')
          PY
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
      - run: uv lock --check
        working-directory: tooling
  quality:
    uses: ./.github/workflows/tooling-quality.yaml
    with:
      # Publish the tooling artifact before alpha installation, not a stable product release.
      base_ref: d2053342856a82905d5ee3f00879e0547cb22909
  build:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    environment: image-publication
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=match,pattern=tooling/v(.*),group=1
      - name: Inspect existing full version without overwriting another revision
        id: inspect
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          version="${GITHUB_REF_NAME#tooling/v}"
          image="$REGISTRY/$IMAGE_NAME:$version"
          set +e
          manifest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' 2>&1)"
          status=$?
          set -e
          if (( status != 0 )); then
            if [[ "$manifest" == *"not found"* || "$manifest" == *"manifest unknown"* ]]; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo 'Registry verification failed; refusing publication' >&2
            exit 1
          fi
          digest="$(jq -er '.digest | select(type == "string")' <<< "$manifest")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          config="$(docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME@$digest" --format '{{json .Image}}')"
          jq -e '.os == "linux" and .architecture == "amd64"' <<< "$config" > /dev/null
          revision="$(jq -er '.config.Labels["org.opencontainers.image.revision"]' <<< "$config")"
          test "$revision" = "$EXPECTED_REVISION"
          echo 'exists=true' >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        if: steps.inspect.outputs.exists == 'false'
        id: build
        with:
          context: tooling
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/neurwerk/k8s_stack_addon_pipecat
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Resolve digest awaiting anonymous verification
        id: resolve
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXISTING_DIGEST: ${{ steps.inspect.outputs.digest }}
        run: |
          digest="${BUILT_DIGEST:-$EXISTING_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $digest; public verification is pending. First publication requires a package administrator to change GHCR visibility to Public." >> "$GITHUB_STEP_SUMMARY"
  verify-public:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify anonymous image access and metadata
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -eu -o pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          version="${GITHUB_REF_NAME#tooling/v}"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo '{"auths":{}}' > "$DOCKER_CONFIG/config.json"
          image="$REGISTRY/$IMAGE_NAME"
          docker pull --platform linux/amd64 "$image:$version"
          docker image inspect "$image:$version" > "$RUNNER_TEMP/pipecat-tooling-image.json"
          jq -e --arg digest "$image@$DIGEST" --arg version "$version" --arg revision "$REVISION" '
            .[0] | (.RepoDigests | index($digest)) != null and
            .Os == "linux" and .Architecture == "amd64" and
            .Config.Labels["org.opencontainers.image.version"] == $version and
            .Config.Labels["org.opencontainers.image.revision"] == $revision and
            .Config.Labels["org.opencontainers.image.source"] == "https://github.com/neurwerk/k8s_stack_addon_pipecat"
          ' "$RUNNER_TEMP/pipecat-tooling-image.json" > /dev/null
          docker pull --platform linux/amd64 "$image@$DIGEST"
      - name: Report pending public verification
        if: failure()
        run: |
          echo 'Public verification failed. Inspect the failed check; if GHCR visibility is private, change it manually to Public, then Re-run failed jobs. Do not overwrite the image tag.' >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: [build, verify-public]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish tooling artifact notes
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          version="${RELEASE_TAG#tooling/v}"
          notes="Public tooling image: ghcr.io/neurwerk/k8s-stack-addon-pipecat-tooling:$version@$IMAGE_DIGEST"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            current="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
            [[ "$current" == *"$IMAGE_DIGEST"* ]]
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Pipecat Neurwerk add-on tooling v$version" --notes "$notes"
          fi

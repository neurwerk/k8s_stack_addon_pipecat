[project]
name = "neurwerk-pipecat"
version = "0.2.1"
description = "Self-hosted voice bots with delegated AgentGateway access"
requires-python = ">=3.12,<3.13"
license = "BSD-2-Clause"
dependencies = [
  "pipecat-ai[webrtc,silero]==1.14.0",
  "boto3>=1.42,<2",
]

[project.scripts]
neurwerk-pipecat = "neurwerk_pipecat.startup:main"
pipecat-bundle = "neurwerk_pipecat.bundle:main"
pipecat-turn-config = "neurwerk_pipecat.turn:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.15,<1", "mypy>=1.19,<2", "types-boto3[s3]>=1.42,<2", "PyYAML>=6.0,<7", "fastapi==0.162.0", "uvicorn==0.54.0", "PyJWT[crypto]==2.15.1", "httpx==0.28.1"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src/neurwerk_pipecat"]

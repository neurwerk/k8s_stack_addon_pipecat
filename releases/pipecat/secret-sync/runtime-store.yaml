apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipecat-external-secrets
  namespace: pipecat
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["pipecat-external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipecat-external-secrets
  namespace: pipecat
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pipecat-external-secrets}
subjects:
  - kind: ServiceAccount
    name: infra-external-secrets
    namespace: infra-external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipecat-external-secrets
  namespace: pipecat
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: pipecat-openbao-secret-store
  namespace: pipecat
spec:
  provider:
    vault:
      server: https://infra-openbao.infra-openbao.svc:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: infra-openbao-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: addon-pipecat-runtime
          serviceAccountRef:
            name: pipecat-external-secrets
            audiences: [openbao]

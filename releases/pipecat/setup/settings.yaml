apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pipecat-oidc-settings
  namespace: auth-keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/pipecat/oidc
      sourceRef: {kind: GitRepository, name: pipecat-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: pipecat-product-values}

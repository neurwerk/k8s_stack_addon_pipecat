apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pipecat-certificate-approval
  namespace: infra-cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/pipecat/certificate-approval
      sourceRef: {kind: GitRepository, name: pipecat-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: client-values}

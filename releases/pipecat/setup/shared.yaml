apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pipecat-shared
  namespace: pipecat
spec:
  interval: 5m
  timeout: 10m
  # Optional TURN may await public routing/certificate issuance; do not block HTTPS fallback.
  install: {disableWait: true}
  upgrade: {disableWait: true}
  chart:
    spec:
      chart: ./charts/pipecat/shared
      sourceRef: {kind: GitRepository, name: pipecat-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: pipecat-product-values}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-pipecat-machines
  namespace: auth-keycloak
spec:
  interval: 5m
  timeout: 15m
  dependsOn:
    - {name: pipecat-identity-secrets}
    - {name: keycloak-pipecat-access}
    - {name: keycloak-agentgateway-oidc}
  chart:
    spec:
      chart: ./charts/pipecat/oidc
      sourceRef: {kind: GitRepository, name: pipecat-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: auth-keycloak-app-defaults}
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: keycloak-product-values}
    - {kind: ConfigMap, name: pipecat-product-values}
    - {kind: ConfigMap, name: pipecat-oidc-approval-values}
  values:
    machineIdentitiesOnly: true

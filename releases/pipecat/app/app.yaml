apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pipecat
  namespace: pipecat
spec:
  interval: 5m
  timeout: 10m
  dependsOn:
    - {name: keycloak-pipecat-machines, namespace: auth-keycloak}
    - {name: pipecat-gateway-registrations, namespace: auth-keycloak-api-key-bridge}
    - {name: pipecat-shared}
    - {name: keycloak-pipecat-oidc, namespace: auth-keycloak}
    - {name: agentgateway, namespace: infra-agentgateway}
    - {name: traefik, namespace: kube-system}
    - {name: pipecat-certificate-approval, namespace: infra-cert-manager}
    - {name: cert-manager-issuers, namespace: infra-cert-manager}
  chart:
    spec:
      chart: ./charts/pipecat/app
      sourceRef: {kind: GitRepository, name: pipecat-addon, namespace: flux-system}
  valuesFrom:
    - {kind: ConfigMap, name: client-values}
    - {kind: ConfigMap, name: pipecat-product-values}

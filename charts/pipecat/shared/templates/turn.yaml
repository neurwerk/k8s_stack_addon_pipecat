{{- if and .Values.pipecat.enabled .Values.pipecat.turn.enabled (not .Values.managedKeysOnly) (not .Values.identityOnly) }}
{{- $t := .Values.pipecat.turn }}
{{- $host := required "turn.hostname is required" $t.hostname }}
{{- if empty $t.nodeSelector }}{{ fail "turn.nodeSelector must pin the relay to the node receiving TLS forwarding" }}{{ end }}
{{- if empty $t.peerAddressRanges }}{{ fail "turn.peerAddressRanges must explicitly allow the bot Pod IPv4 ranges" }}{{ end }}
{{- range $t.peerAddressRanges }}
{{- $bounds := list }}
{{- range (splitList "-" .) }}
{{- $address := int64 0 }}
{{- range (splitList "." .) }}
{{- if gt (int .) 255 }}{{ fail "TURN peer ranges require valid IPv4 addresses" }}{{ end }}
{{- $address = add (mul $address 256) (int .) }}
{{- end }}
{{- $bounds = append $bounds $address }}
{{- end }}
{{- $start := index $bounds 0 }}
{{- $end := index $bounds 1 }}
{{- if or (gt $start $end) (eq $start (int64 0)) (and (le $start (int64 2147483647)) (ge $end (int64 2130706432))) }}{{ fail "TURN peer ranges must be ordered and must not include world, unspecified or loopback addresses" }}{{ end }}
{{- end }}
{{- if or (gt (int $t.relayMinPort) (int $t.relayMaxPort)) (gt (sub (int $t.relayMaxPort) (int $t.relayMinPort)) 63) }}{{ fail "TURN relay range must contain 1-64 ports" }}{{ end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pipecat-turn
  namespace: {{ .Release.Namespace }}
spec:
  secretName: pipecat-turn-tls
  duration: 2160h
  renewBefore: 720h
  privateKey: {algorithm: RSA, size: 2048}
  usages: [digital signature, key encipherment]
  dnsNames: [{{ $host | quote }}]
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: {{ $t.clusterIssuer }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipecat-turn
  namespace: {{ .Release.Namespace }}
data:
  turnserver.conf: |
    tls-listening-port=5349
    min-port={{ $t.relayMinPort }}
    max-port={{ $t.relayMaxPort }}
    realm={{ $host }}
    server-name={{ $host }}
    use-auth-secret
    fingerprint
    cert=/tls/tls.crt
    pkey=/tls/tls.key
    no-udp
    no-tcp
    no-dtls
    no-tlsv1
    no-tlsv1_1
    no-cli
    no-tcp-relay
    no-multicast-peers
    denied-peer-ip=0.0.0.0-255.255.255.255
    denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    {{- range $t.peerAddressRanges }}
    allowed-peer-ip={{ . }}
    {{- end }}
    user-quota=4
    total-quota=64
    max-bps=1000000
    bps-capacity=8000000
    stale-nonce=600
    no-software-attribute
    no-stdout-log
    simple-log
    log-file=/dev/null
    pidfile=/run/coturn/turnserver.pid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipecat-turn
  namespace: {{ .Release.Namespace }}
  annotations:
    secret.reloader.stakater.com/reload: {{ printf "pipecat-turn-tls,%s" $t.secretName | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: pipecat-turn}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pipecat-turn}
      annotations:
        checksum/config: {{ $t | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {{ $t.nodeSelector | toJson }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: configure
          image: {{ required "Publish and verify pipecat.image before enabling managed TURN" .Values.pipecat.image | quote }}
          command: [pipecat-turn-config]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: shared-secret, mountPath: /credentials, readOnly: true}
            - {name: runtime, mountPath: /run/coturn}
      containers:
        - name: turn
          image: {{ $t.image | quote }}
          command: [/usr/bin/turnserver]
          args: [-c, /run/coturn/turnserver.conf]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # Upstream executable carries this file capability; keep it in the bounding set.
              add: [NET_BIND_SERVICE]
          resources: {{ toYaml $t.resources | nindent 12 }}
          startupProbe: {tcpSocket: {port: 5349}, periodSeconds: 5, failureThreshold: 24}
          readinessProbe: {tcpSocket: {port: 5349}}
          livenessProbe: {tcpSocket: {port: 5349}, periodSeconds: 30}
          volumeMounts:
            - {name: runtime, mountPath: /run/coturn}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - {name: config, configMap: {name: pipecat-turn}}
        - {name: shared-secret, secret: {secretName: {{ $t.secretName }}}}
        - {name: tls, secret: {secretName: pipecat-turn-tls, defaultMode: 0440}}
        - {name: runtime, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: pipecat-turn
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app.kubernetes.io/name: pipecat-turn}
  ports:
    - {name: turn-tls, protocol: TCP, port: 5349, targetPort: 5349, nodePort: {{ $t.tlsNodePort }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pipecat-turn
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: pipecat-turn}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {protocol: TCP, port: 5349}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: pipecat, app.kubernetes.io/component: bot}
      ports: [{protocol: UDP, port: {{ $t.relayMinPort }}, endPort: {{ $t.relayMaxPort }}}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: pipecat, app.kubernetes.io/component: bot}
      ports: [{protocol: UDP, port: 1024, endPort: 65535}]
{{- end }}

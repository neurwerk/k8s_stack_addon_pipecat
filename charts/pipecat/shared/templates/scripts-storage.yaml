{{- if and .Values.pipecat.enabled .Values.pipecat.scriptStorage.enabled (not .Values.managedKeysOnly) }}
{{- $s := .Values.pipecat.scriptStorage }}
{{- range $user := list (dict "name" "pipecat-script-publisher" "mask" (list "read" "write" "delete")) (dict "name" "pipecat-script-reader" "mask" (list "read")) }}
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: {{ $user.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  store: {{ required "scriptStorage.store is required" $s.store }}
  clusterNamespace: {{ $s.clusterNamespace }}
  displayName: {{ $user.name }}
  opMask: {{ $user.mask | toJson }}
{{- end }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: pipecat-scripts
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled
provisioner: {{ printf "%s.ceph.rook.io/bucket" $s.clusterNamespace }}
reclaimPolicy: Retain
parameters:
  objectStoreName: {{ $s.store }}
  objectStoreNamespace: {{ $s.clusterNamespace }}
---
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: pipecat-scripts
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  bucketName: {{ required "scriptStorage.bucket is required" $s.bucket }}
  storageClassName: pipecat-scripts
  additionalConfig:
    bucketOwner: pipecat-script-publisher
    bucketPolicy: |
      {"Version":"2012-10-17","Statement":[
        {"Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/pipecat-script-reader"]},"Action":["s3:GetObject"],"Resource":["arn:aws:s3:::{{ $s.bucket }}/*"]},
        {"Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/pipecat-script-publisher"]},"Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::{{ $s.bucket }}"]},
        {"Effect":"Allow","Principal":{"AWS":["arn:aws:iam:::user/pipecat-script-publisher"]},"Action":["s3:PutObject","s3:GetObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::{{ $s.bucket }}/*"]}
      ]}
{{- end }}

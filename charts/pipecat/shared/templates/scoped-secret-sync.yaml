{{- if and .Values.pipecat.enabled .Values.pipecat.secretSync.enabled (not .Values.registrationOnly) }}
{{- if and .Values.managedKeysOnly .Values.identityOnly }}{{ fail "Select only one shared-chart namespace mode" }}{{ end }}
{{- $namespace := .Release.Namespace }}
{{- $store := get .Values.pipecat.secretSync.stores $namespace }}
{{- if ne $store (printf "%s-openbao-secret-store" $namespace) }}{{ fail "Managed Pipecat delivery requires the reviewed namespace-local SecretStore name" }}{{ end }}
{{- $records := list }}
{{- $protected := false }}
{{- range .Values.pipecat.bots }}{{- if not (.anonymous | default false) }}{{- $protected = true }}{{- end }}{{- end }}
{{- $oidc := .Values.pipecat.oidc | default dict }}
{{- $oidcEnabled := $protected }}
{{- if hasKey $oidc "enabled" }}{{- $oidcEnabled = $oidc.enabled }}{{- end }}
{{- if and $protected (not $oidcEnabled) }}{{ fail "Protected bots require OIDC" }}{{ end }}
{{- if and $oidcEnabled (or (ne ($oidc.clientId | default "pipecat") "pipecat") (ne ($oidc.secretName | default "pipecat-oidc-secret") "pipecat-oidc-secret") (ne ($oidc.secretKey | default "clientSecret") "clientSecret")) }}{{ fail "Managed OIDC requires the canonical browser client and Secret reference" }}{{ end }}
{{- if and .Values.pipecat.turn.enabled (ne .Values.pipecat.turn.secretName "pipecat-turn-secret") }}{{ fail "Managed TURN requires its canonical Secret reference" }}{{ end }}
{{- if .Values.managedKeysOnly }}
{{- if ne $namespace "auth-keycloak-api-key-bridge" }}{{ fail "Verifier delivery requires the bridge namespace" }}{{ end }}
{{- range .Values.pipecat.bots }}
{{- if eq (include "pipecat.managedBot" (dict "product" $.Values.pipecat "bot" .)) "true" }}
{{- $records = append $records (dict "name" (printf "pipecat-bot-%s-verifier" .id) "path" (printf "addons/pipecat/verifiers/%s" .id) "fields" (list (dict "key" "apiKeySha256" "property" "gatewayApiKeySha256"))) }}
{{- end }}
{{- end }}
{{- else if .Values.identityOnly }}
{{- if ne $namespace "auth-keycloak" }}{{ fail "Identity delivery requires the Keycloak namespace" }}{{ end }}
{{- if $oidcEnabled }}
{{- $records = append $records (dict "name" "pipecat-oidc-secret" "path" "addons/pipecat/oidc" "fields" (list (dict "key" "clientSecret" "property" "clientSecret"))) }}
{{- end }}
{{- range .Values.pipecat.bots }}
{{- if eq (include "pipecat.managedBot" (dict "product" $.Values.pipecat "bot" .)) "true" }}
{{- $records = append $records (dict "name" (printf "pipecat-bot-%s-oidc" .id) "path" (printf "addons/pipecat/machines/%s" .id) "fields" (list (dict "key" "clientSecret" "property" "clientSecret"))) }}
{{- end }}
{{- end }}
{{- else }}
{{- if ne $namespace "pipecat" }}{{ fail "Runtime delivery requires the pipecat namespace" }}{{ end }}
{{- if $oidcEnabled }}
{{- $records = append $records (dict "name" "pipecat-oidc-secret" "path" "addons/pipecat/oidc" "fields" (list (dict "key" "clientSecret" "property" "clientSecret"))) }}
{{- end }}
{{- if .Values.pipecat.turn.enabled }}
{{- $records = append $records (dict "name" "pipecat-turn-secret" "path" "addons/pipecat/turn" "fields" (list (dict "key" "sharedSecret" "property" "sharedSecret"))) }}
{{- end }}
{{- range .Values.pipecat.bots }}
{{- $bot := . }}
{{- $name := printf "pipecat-bot-%s" .id }}
{{- $fields := list }}
{{- if eq (include "pipecat.managedBot" (dict "product" $.Values.pipecat "bot" .)) "true" }}
{{- $fields = append $fields (dict "key" "gatewayApiKey" "property" "gatewayApiKey") }}
{{- end }}
{{- range $kind := list "stt" "tts" }}
{{- $speech := get $bot $kind | default dict }}
{{- $ref := $speech.secretRef | default dict }}
{{- $field := printf "%sApiKey" $kind }}
{{- if and (eq ($ref.name | default "") $name) (eq ($ref.key | default "") $field) }}
{{- $fields = append $fields (dict "key" $field "property" $field) }}
{{- end }}
{{- end }}
{{- if not (empty $fields) }}
{{- $records = append $records (dict "name" $name "path" (printf "addons/pipecat/bots/%s" .id) "fields" $fields) }}
{{- end }}
{{- end }}
{{- end }}
{{- range $records }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $store }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- $path := .path }}
    {{- range .fields }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ $path }}
        property: {{ .property }}
    {{- end }}
{{- end }}
{{- end }}

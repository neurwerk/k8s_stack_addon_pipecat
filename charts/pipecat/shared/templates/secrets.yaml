{{- if and .Values.pipecat.enabled (not .Values.managedKeysOnly) (not .Values.identityOnly) }}
{{- if and (not (empty .Values.pipecat.secretDeliveries)) (ne .Release.Namespace "pipecat") }}{{ fail "Generic secret deliveries are confined to the pipecat runtime namespace" }}{{ end }}
{{- range .Values.pipecat.secretDeliveries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .fields }}
    {{- if hasPrefix "addons/pipecat/" .path }}{{ fail "Use fixed-path secretSync for Pipecat-owned records; generic delivery cannot widen their readers" }}{{ end }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .path }}
        property: {{ .property }}
    {{- end }}
{{- end }}
{{- end }}

{{- if and .Values.pipecat.enabled (not .Values.managedKeysOnly) }}
{{- range .Values.pipecat.secretDeliveries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .storeName }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .fields }}
    - secretKey: {{ .key }}
      remoteRef:
        key: {{ .path }}
        property: {{ .property }}
    {{- end }}
{{- end }}
{{- end }}

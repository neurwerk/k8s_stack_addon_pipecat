managedKeysOnly: false
identityOnly: false
pipecat:
  enabled: false
  image: ""
  bots: []
  turn:
    enabled: false
    hostname: ""
    secretName: pipecat-turn-secret
    image: coturn/coturn:4.7.0@sha256:a00afb5b4890de4df22bbe70379c6b316685dffee297d53cac1271dcb91fab93
    clusterIssuer: letsencrypt-production-cluster-issuer
    # Leave empty until the public relay NAT mapping is approved and configured.
    advertisedAddress: ""
    udpNodePort: 30478
    tlsNodePort: 30549
    relayMinPort: 31000
    relayMaxPort: 31015
    nodeSelector: {}
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}
  # Existing Secrets work without OpenBao configuration. Explicit deliveries only.
  secretDeliveries: []
  secretSync:
    enabled: false
    stores:
      pipecat: pipecat-openbao-secret-store
      auth-keycloak: auth-keycloak-openbao-secret-store
      auth-keycloak-api-key-bridge: auth-keycloak-api-key-bridge-openbao-secret-store
  scriptStorage:
    enabled: false
    store: ""
    clusterNamespace: infra-rook-ceph
    bucket: ""

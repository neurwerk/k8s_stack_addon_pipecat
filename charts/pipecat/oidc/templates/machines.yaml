{{- if and .Values.pipecat.enabled .Values.machineIdentitiesOnly }}
{{- range .Values.pipecat.bots }}
{{- if eq (include "pipecat.managedBot" (dict "product" $.Values.pipecat "bot" .)) "true" }}
{{- if ne $.Release.Namespace "auth-keycloak" }}{{ fail "Machine provisioning must run in auth-keycloak" }}{{ end }}
{{- $name := printf "pipecat-bot-%s" .id }}
{{- $roles := .gatewayPermissions }}
{{- $model := required "Managed identity preparation requires the canonical modelId, even with sessions disabled" .modelId }}
{{- $approval := get $.Values.pipecat.machineIdentityApprovals .id | default dict }}
{{- if or (ne (get $approval "clientId") $name) (ne (toJson ($roles | sortAlpha)) (toJson ((get $approval "gatewayPermissions" | default list) | sortAlpha))) (not (empty (get $approval "realmRoles"))) (ne (toJson (get $approval "audiences")) (toJson (list "agentgateway"))) }}{{ fail "Managed bot identity requires an exact trusted machineIdentityApprovals object" }}{{ end }}
{{- if ne $.Values.authKeycloak.agentgatewayClientId "agentgateway" }}{{ fail "Scoped service clients require the canonical agentgateway audience" }}{{ end }}
{{- if or (ne (len $roles) (len ($roles | uniq))) (not (has "llm:invoke" $roles)) (not (has (printf "model:%s:invoke" $model) $roles)) }}{{ fail "Managed bot roles require unique llm and canonical model invocation grants" }}{{ end }}
{{- range $roles }}
{{- if not (or (eq . "llm:invoke") (eq . (printf "model:%s:invoke" $model)) (regexMatch `^provider:[a-z0-9][a-z0-9-]{0,47}:company-use$` .)) }}{{ fail "Managed bots may invoke only their canonical model and explicitly approved providers" }}{{ end }}
{{- if not (has . $.Values.authKeycloak.agentgatewayClientRoles) }}{{ fail "Managed bot permission is absent from the approved AgentGateway role catalog" }}{{ end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-oidc
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pipecat-machine-oidc
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: configuration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: configure
          image: {{ required "Managed bots require a published reviewed Tooling image containing upsert-scoped-service-client; legacy upsert is not safe" $.Values.pipecat.machineIdentity.image | quote }}
          command: [upsert-scoped-service-client]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          env:
            - {name: KC_INTERNAL_URL, value: "http://auth-keycloak-keycloak-service.auth-keycloak.svc.cluster.local"}
            - {name: KC_ADMIN_USER, value: {{ required "authKeycloak.adminUser is required" $.Values.authKeycloak.adminUser | quote }}}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: auth-keycloak-secret, key: adminPassword}
            - {name: KC_REALM, value: {{ required "authKeycloak.realm is required" $.Values.authKeycloak.realm | quote }}}
            - {name: KC_CLIENT_ID, value: {{ $name | quote }}}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $name }}-oidc, key: clientSecret}
            - {name: KC_CLIENT_AUDIENCES, value: '["agentgateway"]'}
            - {name: KC_REALM_ROLE_SCOPE, value: "[]"}
            - {name: KC_GATEWAY_ROLE_SCOPE, value: {{ $roles | toJson | quote }}}
            - {name: KC_CLIENT_APPROVAL, value: {{ $approval | toJson | quote }}}
{{- end }}
{{- end }}
{{- end }}

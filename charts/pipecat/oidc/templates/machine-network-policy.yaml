{{- if and .Values.pipecat.enabled .Values.machineIdentitiesOnly }}
{{- $selected := false }}
{{- range .Values.pipecat.bots }}{{- if eq (include "pipecat.managedBot" (dict "product" $.Values.pipecat "bot" .)) "true" }}{{- $selected = true }}{{- end }}{{- end }}
{{- if $selected }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pipecat-machine-oidc
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: pipecat-machine-oidc}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {app: auth-keycloak-keycloak-app}
      ports: [{port: 8080, protocol: TCP}, {port: 9000, protocol: TCP}]
{{- end }}
{{- end }}

machineIdentitiesOnly: false
authKeycloak:
  realm: ""
  adminUser: ""
  agentgatewayClientId: agentgateway
  agentgatewayClientRoles: []
pipecat:
  enabled: false
  hostname: ""
  oidc:
    clientId: pipecat
    secretName: pipecat-oidc-secret
    secretKey: clientSecret
    gatewayPermissions: []
  bots: []
  machineIdentity:
    # Shared generic service-client helper; not the separate Pipecat tooling artifact.
    image: ghcr.io/neurwerk/k8s-stack-tooling:0.18.3@sha256:fa30429bb143f0176867741dcf55eae422d69157b5f033e9d007745dd3639d79
    # Resource budget for each machine identity configuration Job.
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 200m, memory: 256Mi}
  # Trusted client approval, supplied after product values, keyed by bot ID.
  machineIdentityApprovals: {}

{{- if .Values.pipecat.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pipecat
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: pipecat}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{port: 7860, protocol: TCP}]
    {{- if .Values.pipecat.turn.enabled }}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: pipecat-turn}
      ports: [{port: 1024, endPort: 65535, protocol: UDP}]
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- if .Values.pipecat.turn.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: pipecat-turn}
      ports: [{port: {{ .Values.pipecat.turn.relayMinPort }}, endPort: {{ .Values.pipecat.turn.relayMaxPort }}, protocol: UDP}]
    {{- end }}
    {{- with .Values.pipecat.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

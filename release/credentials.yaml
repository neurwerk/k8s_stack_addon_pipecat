# Product-owned setup interface. Names contain only validated kebab-case bot IDs.
version: 1
addon: pipecat
configurationKey: pipecat
namespace: pipecat
managedPreparationEnabledBy: pipecat.secretSync.enabled
botIdPattern: '^[a-z](?:[a-z0-9-]{0,38}[a-z0-9])?$'
reservedBotIds: [turn, product-values]
urlSlugPattern: '^[a-z][a-z0-9_-]{0,63}$'
oidc:
  selection: protected-bot-present-or-explicit-oidc-enabled
  optionalForAnonymous: true
  clientId: pipecat
  admissionRole: pipecat-user
  callbackPattern: 'https://{hostname}/{urlSlug}/auth/callback'
  secretName: pipecat-oidc-secret
  namespaces: [auth-keycloak, pipecat]
  key: clientSecret
  openbao: {path: addons/pipecat/oidc, property: clientSecret}
turn:
  secretName: pipecat-turn-secret
  namespace: pipecat
  key: sharedSecret
  format: 64-lowercase-hex
  openbao: {path: addons/pipecat/turn, property: sharedSecret}
bots:
  selection: pipecat.bots
  runtimeSecretPattern: 'pipecat-bot-{id}'
  namespace: pipecat
  openbaoPathPattern: 'addons/pipecat/bots/{id}'
  fields:
    gatewayApiKey: {property: gatewayApiKey, when: managedIdentity-selected}
    sttApiKey: {property: sttApiKey, when: explicitly-configured}
    ttsApiKey: {property: ttsApiKey, when: explicitly-configured}
  managedIdentity:
    selection: secretSync-enabled-and-anonymous-and-canonical-gateway-ref-and-nonempty-gatewayPermissions
    sessionsEnabledIsPreparationGate: false
    descriptorVersion: 2
    idPattern: 'pipecat-bot-{id}'
    namePattern: 'pipecat-bot-{id}'
    principalKind: service_account
    clientIdPattern: 'pipecat-bot-{id}'
    permissions: pipecat.bots[].gatewayPermissions
    clientSecretNamePattern: 'pipecat-bot-{id}-oidc'
    clientSecretNamespace: auth-keycloak
    clientSecretKey: clientSecret
    clientSecretOpenbaoPathPattern: 'addons/pipecat/machines/{id}'
    clientSecretOpenbaoProperty: clientSecret
    provisioningCommand: upsert-scoped-service-client
    fullScopeAllowed: false
    serviceAccountsEnabled: true
    approvalInput: pipecat.machineIdentityApprovals
    helmRelease: keycloak-pipecat-machines
    toolingRequirement: scoped-service-client-with-exact-service-role-and-scope-reconciliation
    approvalFields: [clientId, realmRoles, gatewayPermissions, audiences]
  gatewayCredentialMode:
    protected: delegated-user-token-only
    anonymous: configured-bot-key-even-after-optional-login
  bridge:
    namespace: auth-keycloak-api-key-bridge
    verifierSecretPattern: 'pipecat-bot-{id}-verifier'
    verifierKey: apiKeySha256
    verifierAlgorithm: sha256-of-raw-api-key-utf8
    verifierProperty: gatewayApiKeySha256
    verifierOpenbaoPathPattern: 'addons/pipecat/verifiers/{id}'
    allowedOpenbaoReadPrefix: addons/pipecat/verifiers/
    grantConfigMapPattern: 'pipecat-bot-{id}-grant'
    grantKey: grant.json
    grantHelmRelease: pipecat-gateway-registrations
    registrationInput: authKeycloakApiKeyBridge.managedRegistrations
session:
  storage: process-memory
  signingSecret: none
  cookie: opaque-random-server-session-id
openbaoReadAccess:
  pipecat: [addons/pipecat/oidc, addons/pipecat/turn, 'addons/pipecat/bots/*']
  auth-keycloak: [addons/pipecat/oidc, 'addons/pipecat/machines/*']
  auth-keycloak-api-key-bridge: ['addons/pipecat/verifiers/*']

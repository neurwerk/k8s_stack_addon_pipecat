# Product-owned setup interface. Names contain only validated kebab-case bot IDs.
version: 1
addon: pipecat
configurationKey: pipecat
namespace: pipecat
botIdPattern: '^[a-z][a-z0-9-]{0,39}$'
urlSlugPattern: '^[a-z][a-z0-9_-]{0,63}$'
oidc:
  clientId: pipecat
  admissionRole: pipecat-user
  callbackPattern: 'https://{hostname}/{urlSlug}/auth/callback'
  secretName: pipecat-oidc-secret
  namespaces: [auth-keycloak, pipecat]
  key: clientSecret
  openbao: {path: addons/pipecat/runtime, property: oidcClientSecret}
turn:
  secretName: pipecat-turn-secret
  namespace: pipecat
  key: sharedSecret
  format: 64-lowercase-hex
  openbao: {path: addons/pipecat/runtime, property: turnSharedSecret}
bots:
  selection: pipecat.bots
  runtimeSecretPattern: 'pipecat-bot-{id}'
  namespace: pipecat
  openbaoPathPattern: 'addons/pipecat/bots/{id}'
  fields:
    gatewayApiKey: {property: gatewayApiKey, when: anonymous-and-sessions-enabled}
    sttApiKey: {property: sttApiKey, when: explicitly-configured}
    ttsApiKey: {property: ttsApiKey, when: explicitly-configured}
  managedIdentity:
    descriptorVersion: 2
    idPattern: 'pipecat-bot-{id}'
    namePattern: 'pipecat-bot-{id}'
    principalKind: service_account
    clientIdPattern: 'pipecat-bot-{id}'
    permissions: pipecat.bots[].gatewayPermissions
  bridge:
    namespace: auth-keycloak-api-key-bridge
    verifierSecretPattern: 'pipecat-bot-{id}-verifier'
    verifierKey: apiKeySha256
    verifierAlgorithm: sha256-of-raw-api-key-utf8
    verifierProperty: gatewayApiKeySha256
    grantConfigMapPattern: 'pipecat-bot-{id}-grant'
    grantKey: grant.json
    grantHelmRelease: pipecat-gateway-registrations
    registrationInput: authKeycloakApiKeyBridge.managedRegistrations
session:
  storage: process-memory
  signingSecret: none
  cookie: opaque-random-server-session-id

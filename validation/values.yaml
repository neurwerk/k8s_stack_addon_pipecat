# Offline rendering only. This local image name is never a deployment/release pin.
pipecat:
  enabled: true
  hostname: voice.example.com
  image: neurwerk-pipecat:local
  secretSync:
    enabled: true
  turn:
    enabled: true
    hostname: turn.example.com
    advertisedAddress: 203.0.113.10
    nodeSelector: {kubernetes.io/hostname: relay-example}
  gatewayOrigin: https://gateway.example.com
  oidc:
    issuer: https://identity.example.com/realms/example
  bots:
    - id: example
      urlSlug: simple_chatbot
      sessionsEnabled: true
      anonymous: false
      bindingId: voice
      modelId: example-model
      stt: {baseUrl: https://speech.example.com/v1, model: whisper-1}
      tts: {baseUrl: https://speech.example.com/v1, model: tts-1, voice: alloy}
    - id: public-example
      sessionsEnabled: true
      anonymous: true
      gatewayPermissions: ["llm:invoke", "model:example-model:invoke"]
      bindingId: voice
      modelId: example-model
      stt: {baseUrl: https://speech.example.com/v1, model: whisper-1}
      tts: {baseUrl: https://speech.example.com/v1, model: tts-1, voice: alloy}
    - id: not-ready
      anonymous: false
      sessionsEnabled: false
